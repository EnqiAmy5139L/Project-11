<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hey :) </title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        :root {
            --bg: #04091a;
            --cream: #f0e2c4;
            --amber: #00c8ff;
            --rose: #bf6475;
            --dim: rgba(240,226,196,0.38);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background: var(--bg);
            font-family: 'Lora', serif;
            color: var(--cream);
            overflow: hidden; cursor: none;
        }

        #dot { position:fixed; width:10px; height:10px; border-radius:50%; background:#00c8ff; pointer-events:none; z-index:99999; margin-left:-5px; margin-top:-5px; }
        
        

        .bg-img { position: fixed; inset: 0; z-index: 0; background: url('https://i.ibb.co/JRVywNQN/rain.jpg') no-repeat center/cover; }
        .bg-veil { position: fixed; inset: 0; z-index: 1; background: rgba(4,9,26,0.78); }
        #rc { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.28; }
        .petal { position: fixed; pointer-events: none; z-index: 3; font-size: 11px; opacity: 0; }

        .slide {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; padding: 40px 20px;
        }
        #slide2 { display: none; }

        .tag {
            font-family: 'Caveat', cursive;
            font-size: 1.05rem; color: var(--amber);
            margin-bottom: 16px; opacity: 0.85;
        }
        h1 {
            font-family: 'Caveat', cursive;
            font-size: clamp(2.6rem, 6.5vw, 4.5rem);
            font-weight: 700; line-height: 1.1;
            color: var(--cream); max-width: 600px;
            margin-bottom: 8px;
        }
        .sub {
            font-style: italic; font-size: 0.95rem;
            color: var(--dim); margin-bottom: 38px;
        }

        .squig {
            width: 120px; margin: 0 auto 34px;
            opacity: 0.35;
        }

        .btn1 {
            font-family: 'Lora', serif; font-size: 0.95rem;
            padding: 11px 36px; background: transparent;
            border: 1.5px solid rgba(0,200,255,0.5);
            color: var(--amber); cursor: none;
            border-radius: 2px;
            transition: background 0.22s, color 0.22s;
        }
        .btn1:hover { background: var(--amber); color: var(--bg); }

        #s2img {
            width: 105px; height: auto;
            filter: drop-shadow(0 0 18px rgba(0,200,255,0.3));
            margin-bottom: 20px;
        }
        #s2title {
            font-family: 'Caveat', cursive;
            font-size: 2rem; font-weight: 600;
            color: var(--cream); margin-bottom: 5px;
        }
        #s2sub {
            font-style: italic; font-size: 0.95rem;
            color: var(--dim); margin-bottom: 3px;
        }
        #s2hint {
            font-size: 0.78rem; font-style: italic;
            color: rgba(240,226,196,0.2); margin-bottom: 28px;
        }
        .btns { display: flex; gap: 14px; justify-content: center; }

        .yb, .nb {
            font-family: 'Lora', serif; font-size: 0.9rem;
            padding: 10px 30px; background: transparent;
            border-radius: 2px; cursor: none;
            transition: all 0.22s;
        }
        .yb {
            border: 1.5px solid rgba(191,100,117,0.55);
            color: var(--rose);
        }
        .yb:hover { background: var(--rose); color: var(--bg); }
        .nb {
            border: 1.5px solid rgba(240,226,196,0.18);
            color: rgba(240,226,196,0.35);
        }
    </style>
</head>
<body>
<div id="dot"></div>


<div class="bg-img"></div>
<div class="bg-veil"></div>
<canvas id="rc"></canvas>

<div id="slide1" class="slide">
    <p class="tag"> ✦ Project 11 ✦</p>
    <h1>Made you a Birthday Present,<br>hope you like it :)</h1>
    <p class="sub">— Enjoy!!! —</p>
    <svg class="squig" viewBox="0 0 120 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 10 C 20 2, 30 18, 50 10 S 80 2, 100 10 S 115 18, 118 10"
              stroke="#00c8ff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </svg>
    <button class="btn1" onclick="goSlide2()">Step Inside</button>
</div>

<div id="slide2" class="slide">
    <img id="s2img" src="https://i.ibb.co/dvxsyKc/Screenshot-2026-02-08-105309.png" alt="cat">
    <h2 id="s2title">A Gift has arrived for you.</h2>
    <p id="s2sub">open it?</p>
    <p id="s2hint">[ try clicking no btw ]</p>
    <div class="btns">
        <button class="yb" id="yBtn" onclick="window.location.href='decryption.html'">yes pls</button>
        <button class="nb" id="nBtn">nah</button>
    </div>
</div>

<script>
    const dot = document.getElementById('dot');
    let mx = innerWidth/2, my = innerHeight/2;
    document.addEventListener('mousemove', function(e){ mx=e.clientX; my=e.clientY; dot.style.left=mx+'px'; dot.style.top=my+'px'; });

    // rain
    const rc = document.getElementById('rc');
    const rx2 = rc.getContext('2d');
    rc.width = innerWidth; rc.height = innerHeight;
    const drps = Array.from({length:100},()=>({
        x:Math.random()*rc.width, y:Math.random()*rc.height,
        l:Math.random()*14+6, sp:Math.random()*3+2, a:Math.random()*0.3+0.07
    }));
    (function rain(){
        rx2.clearRect(0,0,rc.width,rc.height);
        drps.forEach(d=>{
            rx2.beginPath();rx2.moveTo(d.x,d.y);rx2.lineTo(d.x-0.8,d.y+d.l);
            rx2.strokeStyle=`rgba(160,200,240,${d.a})`;rx2.lineWidth=0.6;rx2.stroke();
            d.y+=d.sp; if(d.y>rc.height){d.y=-d.l;d.x=Math.random()*rc.width;}
        });
        requestAnimationFrame(rain);
    })();

    // petals
    const PP=['🌸','✿','❀'];
    setInterval(()=>{
        const p=document.createElement('div');p.className='petal';
        p.textContent=PP[Math.floor(Math.random()*PP.length)];
        p.style.left=Math.random()*100+'vw';p.style.top='-18px';
        document.body.appendChild(p);
        gsap.fromTo(p,{opacity:0},{opacity:0.45,duration:0.9});
        gsap.to(p,{y:innerHeight+40,x:(Math.random()-.5)*150,rotation:Math.random()*360,
            duration:Math.random()*6+5,ease:'none',onComplete:()=>p.remove()});
    },650);

    gsap.set(['.tag','h1','.sub','.squig','.btn1'],{opacity:0,y:16});
    gsap.timeline({delay:0.35})
        .to('.tag',   {opacity:1,y:0,duration:0.8,ease:'power2.out'})
        .to('h1',     {opacity:1,y:0,duration:1,  ease:'power2.out'},0.2)
        .to('.sub',   {opacity:1,y:0,duration:0.7,ease:'power2.out'},0.55)
        .to('.squig', {opacity:0.35,y:0,duration:0.6},0.7)
        .to('.btn1',  {opacity:1,y:0,duration:0.7,ease:'back.out(1.8)'},0.95);

    function goSlide2(){
        gsap.to('#slide1',{opacity:0,y:-18,duration:0.55,onComplete:()=>{
            document.getElementById('slide1').style.display='none';
            const s2=document.getElementById('slide2');
            s2.style.display='flex';
            gsap.set(s2,{opacity:0});
            gsap.set('#s2img',{opacity:0,scale:0.65,rotation:-12});
            gsap.set(['#s2title','#s2sub','#s2hint'],{opacity:0,y:10});
            gsap.set('.btns',{opacity:0,y:12});
            gsap.timeline()
                .to(s2,     {opacity:1,duration:0.3})
                .to('#s2img',{opacity:1,scale:1,rotation:0,duration:0.75,ease:'back.out(2)'},0.15)
                .to('#s2title',{opacity:1,y:0,duration:0.6},0.55)
                .to('#s2sub',{opacity:1,y:0,duration:0.5},0.75)
                .to('#s2hint',{opacity:1,duration:0.4},0.95)
                .to('.btns',{opacity:1,y:0,duration:0.55,ease:'back.out(1.5)'},1.05);

            const nb=document.getElementById('nBtn');
            let gone=false;
            nb.addEventListener('mouseenter',()=>{
                if(!gone){
                    const r=nb.getBoundingClientRect();
                    document.body.appendChild(nb);
                    gsap.set(nb,{position:'fixed',left:r.left,top:r.top,margin:0,zIndex:99999});
                    gone=true;
                }
                gsap.to(nb,{
                    left:Math.random()*(innerWidth-nb.offsetWidth),
                    top:Math.random()*(innerHeight-nb.offsetHeight),
                    duration:0.2, ease:'power3.out'
                });
                gsap.to('#s2img',{rotation:(Math.random()-.5)*18,scale:1.2,duration:0.25,
                    onComplete:()=>gsap.to('#s2img',{rotation:0,scale:1,duration:0.5,delay:0.3})});
            });
        }});
    }
</script>
</body>
</html>
